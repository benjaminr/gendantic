[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gendantic"
dynamic = ["version"]
description = "Generate synthetic data using Pydantic models and LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Benjamin Rowell", email = "ben.rowell@ai.gov.uk" }]
keywords = [
    "synthetic-data",
    "pydantic",
    "llm",
    "statistics",
    "distributions",
    "copula",
    "data-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic[email]>=2.5.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.1.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/benjaminr/gendantic"
Repository = "https://github.com/benjaminr/gendantic"
Documentation = "https://github.com/benjaminr/gendantic#readme"
Changelog = "https://github.com/benjaminr/gendantic/blob/main/CHANGELOG.md"
Issues = "https://github.com/benjaminr/gendantic/issues"

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
]
pandas = [
    "pandas>=2.0.0",
]
db = [
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
]

[tool.setuptools.package-data]
gendantic = ["prompts/*.txt", "py.typed"]

# Version is derived from git tags (setuptools-scm): tag ``vX.Y.Z`` for a
# release; commits after a tag get e.g. ``0.1.1.dev4+g<sha>`` automatically, so
# the patch advances on its own while major/minor only move when we tag.
# ``fallback_version`` keeps builds working when git history/tags are absent
# (e.g. building from an unpacked sdist without a .git directory).
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N806", "B017"]
"examples/*" = ["S101", "N806"]
"src/gendantic/model_generator.py" = ["S102"]  # exec() is secured via AST validation

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.10",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["gendantic"]
branch = true

[tool.coverage.report]
show_missing = true
