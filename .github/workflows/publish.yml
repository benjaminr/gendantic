name: Publish

# Publishes to PyPI when a GitHub Release is published. The release tag
# (e.g. v0.1.0) must match the version in pyproject.toml.
on:
  release:
    types: [published]

jobs:
  test:
    name: Gate (lint, type check, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras --python 3.12

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src/gendantic

      - name: Test with coverage (fail under 85%)
        run: uv run pytest --cov=gendantic --cov-report=term-missing --cov-fail-under=85

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run --no-project python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag ($tag) does not match pyproject version ($pkg)" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gendantic
    permissions:
      id-token: write  # trusted publishing (OIDC); no API token needed
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
